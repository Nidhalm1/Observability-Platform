global:
  scrape_interval: 15s

# Targets use the in-network port 8080, not the published host ports --
# Prometheus runs inside the same compose network and resolves service names
# via Docker's DNS.
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ['gateway:8080']}]
  - job_name: orders
    static_configs: [{targets: ['orders:8080']}]
  - job_name: inventory
    static_configs: [{targets: ['inventory:8080']}]
