receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317  #open a port let my services connect and send to him

processors:
  batch: #batch acrrose all services before sending to tempo

exporters: # where the collect sends the data to
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]