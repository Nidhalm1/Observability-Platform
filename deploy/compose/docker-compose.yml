name: obs-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: obs
      POSTGRES_PASSWORD: obs
      POSTGRES_DB: obs
    ports:
      - "5052:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Applied once, on a FRESH data dir, in filename order. Only the .up.sql
      # files are mounted: mounting the whole directory would also run the
      # .down.sql files, and "down" sorts before "up".
      # To re-apply after editing them: docker compose down -v
      - ../../db/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../db/migrations/000002_seed_inventory.up.sql:/docker-entrypoint-initdb.d/02_seed_inventory.sql:ro
      - ../../db/migrations/000003_seed_orders.up.sql:/docker-entrypoint-initdb.d/03_seed_orders.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP. During initdb, Postgres listens on the unix
      # socket only -- a socket check reports healthy while the 200k-row seed is
      # still running, and the services start against empty tables.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U obs -d obs"]
      interval: 5s
      timeout: 3s
      retries: 30 # 30 check if 30 timout then the service is unhealthy. 
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres

  inventory:
    build:
      context: ../..
      args:
        SERVICE: inventory
    environment:
      DATABASE_URL: postgres://obs:obs@postgres:5432/obs?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PORT: 8080
      # Fault 3 (pool exhaustion). Read from the shell so the value can be
      # changed without editing this file:
      #   DB_MAX_OPEN_CONNS=3 docker compose up -d --force-recreate inventory
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-3}
    ports:
      - "5048:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Longer than the 10s shutdown + 5s span flush in main(), so the last batch
    # of spans leaves the process before Docker sends SIGKILL.
    stop_grace_period: 20s


  orders:
    build:
      context: ../..
      args:
        SERVICE: orders
    environment:
      DATABASE_URL: postgres://obs:obs@postgres:5432/obs?sslmode=disable
      INVENTORY_SERVICE_URL: http://inventory:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PORT: 8080
     
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-3}
      # Fault 4 (missing timeout). Off by default -- with it on, orders waits
      DISABLE_CLIENT_TIMEOUT: ${DISABLE_CLIENT_TIMEOUT:-false}
    ports:
      - "5049:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_started
    stop_grace_period: 20s

  # No DATABASE_URL: the gateway has no database. It validates and routes.
  gateway:
    build:
      context: ../..
      args:
        SERVICE: gateway
    environment:
      ORDERS_SERVICE_URL: http://orders:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PORT: 8080
    ports:
      - "5047:8080"
    depends_on:
      orders:
        condition: service_started
    stop_grace_period: 20s

  prometheus:
    image: prom/prometheus:latest
    command:
      # Default retention is 15d. A 30-day error budget over 15 days of data
      # silently computes over whatever exists and looks fine (Phase 14).
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=45d
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - gateway


  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      - tempo


  tempo:
    image: grafana/tempo:latest
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo


  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus
      - loki


  loki:
    image: grafana/loki:latest
    user: "0:0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki # keep the logs in a volume so that they are not lost when the container is restarted

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data #for own data 
      - /etc/alloy/config.river #config file
    volumes:
      - ./alloy.river:/etc/alloy/config.river:ro # it's a config file, not a directory, so mount it read-only
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data # store its data in a volume nothing special
    depends_on:
      - loki

volumes:
  postgres_data:
  prom-data:
  tempo-data:
  loki-data:
  alloy-data:
  
