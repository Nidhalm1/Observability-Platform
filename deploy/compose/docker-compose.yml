services:
  postgres:
    image: postgres:16 
    environment:
      POSTGRES_USER: obs
      POSTGRES_PASSWORD: obs
      POSTGRES_DB: obs

    ports:
      - "5052:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      
    ports:
      - "5051:80"
    depends_on:
      - postgres

  orders:
    environment:
      DATABASE_URL: postgres://obs:obs@postgres:5432/obs?sslmode=disable
      PORT: 8080
    ports:
      - "5049:8080"
    depends_on:
      - postgres

  inventory:
    environment:
      DATABASE_URL: postgres://obs:obs@postgres:5432/obs?sslmode=disable
      PORT: 8080
    ports:
      - "5048:8080"
    depends_on:
      - postgres

  gateway:
    environment:
      DATABASE_URL: postgres://obs:obs@postgres:5432/obs?sslmode=disable
      PORT: 8080
    ports:
      - "5047:8080"
    depends_on:
      - orders

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=45d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prom-data:/prometheus
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  prom-data:

